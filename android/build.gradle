import java.security.MessageDigest
import java.security.NoSuchAlgorithmException

group = "com.alphay.flutter.plugins.flutter_rk3568_uvccamera.flutter_rk3568_uvccamera"
version = "1.0"
String mavenLocalPath = rootProject.mkdir("m2repository").absolutePath

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(mavenLocalPath)
        }
    }
}

apply plugin: "com.android.library"
// ===============aar start=====================
task useAar {
    File file = project.file("libs")
    if (file.exists() && file.isDirectory()) {
        file.listFiles(new FileFilter() {
            @Override
            boolean accept(File pathname) {
                return pathname.name.endsWith(".aar")
            }
        }).each { item ->
            String aarName = item.name.substring(0, item.name.length() - 4)
            String[] aarInfo = aarName.split("-")
            String sha1 = getFileSha1(item)
            String md5 = getFileMD5(item)
            String fromStr = item.path
            String intoStr = mavenLocalPath + "/" + aarInfo[0].replace(".", "/") + "/" + aarInfo[1] + "/" + aarInfo[2]
            String newName = aarInfo[1] + "-" + aarInfo[2] + ".aar"

            project.copy {
                from fromStr
                into intoStr
                rename(item.name, newName)
            }

            project.file(intoStr + "/" + newName + ".md5").write(md5)
            project.file(intoStr + "/" + newName + ".sha1").write(sha1)

            String pomPath = intoStr + "/" + newName.substring(0, newName.length() - 4) + ".pom"
            project.file(pomPath).write(createPomStr(aarInfo[0], aarInfo[1], aarInfo[2]))
            project.file(pomPath + ".md5").write(getFileMD5(project.file(pomPath)))
            project.file(pomPath + ".sha1").write(getFileSha1(project.file(pomPath)))

            String metadataPath = project.file(intoStr).getParentFile().path + "/maven-metadata.xml"
            project.file(metadataPath).write(createMetadataStr(aarInfo[0], aarInfo[1], aarInfo[2]))
            project.file(metadataPath + ".md5").write(getFileMD5(project.file(metadataPath)))
            project.file(metadataPath + ".sha1").write(getFileSha1(project.file(metadataPath)))
            dependencies {
                implementation "${aarInfo[0]}:${aarInfo[1]}:${aarInfo[2]}"
            }
        }
    }
}

public static String createMetadataStr(String groupId, String artifactId, String version) {
    return "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
            "<metadata>\n" +
            "  <groupId>$groupId</groupId>\n" +
            "  <artifactId>$artifactId</artifactId>\n" +
            "  <versioning>\n" +
            "    <release>$version</release>\n" +
            "    <versions>\n" +
            "      <version>$version</version>\n" +
            "    </versions>\n" +
            "    <lastUpdated>${new Date().format('yyyyMMdd')}000000</lastUpdated>\n" +
            "  </versioning>\n" +
            "</metadata>\n"
}

public static String createPomStr(String groupId, String artifactId, String version) {
    return "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" +
            "<project xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\" xmlns=\"http://maven.apache.org/POM/4.0.0\"\n" +
            "    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\">\n" +
            "  <modelVersion>4.0.0</modelVersion>\n" +
            "  <groupId>$groupId</groupId>\n" +
            "  <artifactId>$artifactId</artifactId>\n" +
            "  <version>$version</version>\n" +
            "  <packaging>aar</packaging>\n" +
            "</project>\n"
}

public static String getFileSha1(File file) {
    FileInputStream input = null;
    try {
        input = new FileInputStream(file);
        MessageDigest digest = MessageDigest.getInstance("SHA-1");
        byte[] buffer = new byte[1024 * 1024 * 10];

        int len = 0;
        while ((len = input.read(buffer)) > 0) {
            digest.update(buffer, 0, len);
        }
        String sha1 = new BigInteger(1, digest.digest()).toString(16);
        int length = 40 - sha1.length();
        if (length > 0) {
            for (int i = 0; i < length; i++) {
                sha1 = "0" + sha1;
            }
        }
        return sha1;
    }
    catch (IOException e) {
        System.out.println(e);
    }
    catch (NoSuchAlgorithmException e) {
        System.out.println(e);
    }
    finally {
        try {
            if (input != null) {
                input.close();
            }
        }
        catch (IOException e) {
            System.out.println(e);
        }
    }
}

public static String getFileMD5(File file) {
    FileInputStream input = null;
    try {
        input = new FileInputStream(file);
        MessageDigest digest = MessageDigest.getInstance("MD5");
        byte[] buffer = new byte[1024 * 1024 * 10];

        int len = 0;
        while ((len = input.read(buffer)) > 0) {
            digest.update(buffer, 0, len);
        }
        String md5 = new BigInteger(1, digest.digest()).toString(16);
        int length = 32 - md5.length();
        if (length > 0) {
            for (int i = 0; i < length; i++) {
                md5 = "0" + md5;
            }
        }
        return md5;
    }
    catch (IOException e) {
        System.out.println(e);
    }
    catch (NoSuchAlgorithmException e) {
        System.out.println(e);
    }
    finally {
        try {
            if (input != null) {
                input.close();
            }
        }
        catch (IOException e) {
            System.out.println(e);
        }
    }
}
// ===============aar end=====================

// ===============face-sdk 模型编译期下载 start=====================
// 模型不随仓库分发：编译时检查本地 assets 下模型是否齐全，缺失则从远端下载解压。
// 默认地址指向 GitHub Release，可用 -PfaceModelsUrl=... 覆盖（如内网镜像），校验和同理 -PfaceModelsSha256=...。
def faceModelsAssetsDir = file("src/main/assets/face-sdk-models")
def faceModelsUrl = project.findProperty("faceModelsUrl")
        ?: "https://github.com/nottyjay/flutter_rk3566_baidu_orc/releases/download/models-v1.0.0/face-sdk-models.zip"
def faceModelsSha256 = project.findProperty("faceModelsSha256")
        ?: "f509e4763a32b1bd87af2b96daaced836116e9e3b9e48ab4db13bb4f90485a89"
def faceModelsCache = file("${buildDir}/face-sdk-cache/face-sdk-models.zip")

static String sha256Of(File f) {
    def digest = java.security.MessageDigest.getInstance("SHA-256").digest(f.bytes)
    return digest.encodeHex().toString()
}

static void downloadToFile(String urlStr, File target) {
    final int[] redirectCodes = [301, 302, 303, 307, 308]
    String current = urlStr
    for (int i = 0; i < 5; i++) {
        def conn = (HttpURLConnection) new URL(current).openConnection()
        conn.instanceFollowRedirects = false
        conn.connectTimeout = 15000
        conn.readTimeout = 120000
        int code = conn.responseCode
        if (code in redirectCodes) {
            current = conn.getHeaderField("Location")
            conn.disconnect()
            continue
        }
        if (code != 200) {
            conn.disconnect()
            throw new GradleException("下载模型失败: HTTP " + code + " " + current
                    + "\n可检查网络，或使用内网镜像: ./gradlew -PfaceModelsUrl=<镜像地址>")
        }
        target.parentFile.mkdirs()
        conn.inputStream.withStream { input ->
            target.withOutputStream { output -> output << input }
        }
        conn.disconnect()
        return
    }
    throw new GradleException("下载模型失败: 重定向次数过多 " + urlStr)
}

// 关键模型存在性检查：以 detect 模型为哨兵文件（单文件检查，成本可忽略）
task ensureFaceModels {
    group = "face-sdk"
    description = "编译期检查本地 face-sdk 模型，缺失时自动下载解压到 assets"
    onlyIf {
        !file("${faceModelsAssetsDir}/detect/detect_V192x192_v8.0.rknn.encrypted").exists()
    }
    doLast {
        println "face-sdk 模型缺失，开始下载: " + faceModelsUrl
        if (faceModelsCache.exists() && sha256Of(faceModelsCache) != faceModelsSha256) {
            faceModelsCache.delete()
        }
        if (!faceModelsCache.exists()) {
            downloadToFile(faceModelsUrl, faceModelsCache)
        }
        def actualSha = sha256Of(faceModelsCache)
        if (actualSha != faceModelsSha256) {
            faceModelsCache.delete()
            throw new GradleException("模型包校验失败: 期望 sha256=" + faceModelsSha256
                    + ", 实际=" + actualSha
                    + "\n若使用内网镜像，请同时覆盖 -PfaceModelsSha256=<镜像包校验和>")
        }
        copy {
            from zipTree(faceModelsCache)
            into faceModelsAssetsDir.parentFile
        }
        println "face-sdk 模型解压完成: " + faceModelsAssetsDir
    }
}

// 维护者助手：将当前 assets 下模型打包为待上传的 Release 附件并输出 sha256
task packFaceModels {
    group = "face-sdk"
    description = "打包 face-sdk-models 为 Release 附件 (android/build/face-sdk-cache/face-sdk-models.zip)"
    doLast {
        faceModelsCache.parentFile.mkdirs()
        ant.zip(destfile: faceModelsCache, basedir: faceModelsAssetsDir.parentFile,
                includes: "face-sdk-models/**", excludes: "face-sdk-models/README.md")
        println "已生成: " + faceModelsCache
        println "sha256: " + sha256Of(faceModelsCache)
    }
}

tasks.named("preBuild") { it.dependsOn ensureFaceModels }
// ===============face-sdk 模型编译期下载 end=====================

android {
    namespace = "com.alphay.flutter.plugins.flutter_rk3568_uvccamera.flutter_rk3568_uvccamera"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24

        ndk {
            moduleName "arcface_rk3568"
            ldLibs "log"
            abiFilters "arm64-v8a"
        }
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir "libs"
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        testImplementation("junit:junit:4.13.2")
        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation 'cn.hutool:hutool-core:5.8.35'
        implementation 'io.github.faceaisdk:Android:2025.08.18.beta'
        implementation 'androidx.cardview:cardview:1.0.0'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        implementation "androidx.recyclerview:recyclerview:1.3.2"
    }
}
